name: EAS Update
on:
  push:
    branches:
      - ota-updates-online # Jalankan otomatis saat ada push ke branch 'ota-updates-online'

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v3

      - name: 🏗 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: npm

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Publish Update
        run: >
          eas update --branch ota-updates-online --environment production --message "Auto-update from GitHub Actions: ${{ github.event.head_commit.message }}"
