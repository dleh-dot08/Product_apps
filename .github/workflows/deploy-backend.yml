name: Deploy Backend

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [developments]
    paths:
      - backend-admin/**
      - .github/workflows/deploy-backend.yml

env:
  REGISTRY: ghcr.io
  SERVER_APP_DIR: ~/repositories/Product_apps/backend-admin
  CONTAINER_NAME: backend-admin
  DB_NETWORK: postgres_database

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - id: image
        run: |
          owner="${{ secrets.GHCR_USERNAME }}"
          echo "image=ghcr.io/${owner,,}/backend-admin" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend-admin
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - uses: actions/checkout@v4

      - name: Connect to NetBird
        uses: Alemiz112/netbird-connect@v1.0.1
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          hostname: github-actions-deploy
          management-url: https://api.netbird.io:443

      - name: Wait for NetBird
        run: |
          sleep 10
          netbird status
          ping -c 3 ${{ secrets.SERVER_HOST }} || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          command_timeout: 25m
          script: |
            set -e

            mkdir -p \
              ${{ env.SERVER_APP_DIR }}/storage/app/public \
              ${{ env.SERVER_APP_DIR }}/storage/framework/cache \
              ${{ env.SERVER_APP_DIR }}/storage/framework/sessions \
              ${{ env.SERVER_APP_DIR }}/storage/framework/views \
              ${{ env.SERVER_APP_DIR }}/storage/logs \
              ${{ env.SERVER_APP_DIR }}/bootstrap/cache

            echo "${{ secrets.GHCR_PAT }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            docker pull ${{ needs.build-image.outputs.image }}:${{ github.sha }}

            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --network ${{ env.DB_NETWORK }} \
              -p 8000:80 \
              --env-file ${{ env.SERVER_APP_DIR }}/.env \
              -v ${{ env.SERVER_APP_DIR }}/storage:/var/www/html/storage \
              -v ${{ env.SERVER_APP_DIR }}/bootstrap/cache:/var/www/html/bootstrap/cache \
              ${{ needs.build-image.outputs.image }}:${{ github.sha }}

            docker exec ${{ env.CONTAINER_NAME }} chown -R www-data:www-data storage bootstrap/cache
            docker exec ${{ env.CONTAINER_NAME }} php artisan migrate
            docker exec ${{ env.CONTAINER_NAME }} php artisan config:cache
            docker exec ${{ env.CONTAINER_NAME }} php artisan view:cache
