name: Deploy Backend

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [developments]
    paths:
      - backend-admin/**
      - .github/workflows/deploy-backend.yml

env:
  REGISTRY: ghcr.io
  SERVER_APP_DIR: ~/repositories/Product_apps/backend-admin
  CONTAINER_NAME: backend-admin

jobs:
  build_images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          owner="$GHCR_USERNAME"
          if [ -z "$owner" ]; then
            echo "GHCR_USERNAME secret is required" >&2
            exit 1
          fi
          echo "IMAGE_NAME=ghcr.io/${owner,,}/driver-app" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend-admin
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build_images

    steps:
      - uses: actions/checkout@v4

      - name: Connect to NetBird
        uses: Alemiz112/netbird-connect@v1.0.1
        with:
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          hostname: github-actions-deploy
          management-url: https://api.netbird.io:443

      - name: Wait for NetBird
        run: |
          sleep 10
          netbird status
          ping -c 3 ${{ secrets.SERVER_HOST }}

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: backend-admin/docker-compose.yml
          target: ~/repositories/Product_apps

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          command_timeout: 25m
          script: |
            set -e

            mkdir -p \
              ${{ env.SERVER_APP_DIR }}/storage/app/public \
              ${{ env.SERVER_APP_DIR }}/storage/framework/cache \
              ${{ env.SERVER_APP_DIR }}/storage/framework/sessions \
              ${{ env.SERVER_APP_DIR }}/storage/framework/views \
              ${{ env.SERVER_APP_DIR }}/storage/logs \
              ${{ env.SERVER_APP_DIR }}/bootstrap/cache

            echo "${{ secrets.GHCR_PAT }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            cd ${{ env.SERVER_APP_DIR }}

            if [ -z "${{ secrets.OTA_PUBLISH_TOKEN }}" ]; then
              echo "OTA_PUBLISH_TOKEN secret belum tersedia"
              exit 1
            fi

            touch .env

            if grep -q '^OTA_PUBLISH_TOKEN=' .env; then
              sed -i "s|^OTA_PUBLISH_TOKEN=.*$|OTA_PUBLISH_TOKEN=${{ secrets.OTA_PUBLISH_TOKEN }}|" .env
            else
              printf '\nOTA_PUBLISH_TOKEN=%s\n' "${{ secrets.OTA_PUBLISH_TOKEN }}" >> .env
            fi

            GHCR_USERNAME=${{ secrets.GHCR_USERNAME }} IMAGE_TAG=${{ github.sha }} docker compose pull
            GHCR_USERNAME=${{ secrets.GHCR_USERNAME }} IMAGE_TAG=${{ github.sha }} docker compose up -d --force-recreate

            docker compose exec -T ${{ env.CONTAINER_NAME }} chown -R www-data:www-data storage bootstrap/cache
            docker compose exec -T ${{ env.CONTAINER_NAME }} php artisan migrate --force
            docker compose exec -T ${{ env.CONTAINER_NAME }} php artisan config:cache
            docker compose exec -T ${{ env.CONTAINER_NAME }} php artisan view:cache
